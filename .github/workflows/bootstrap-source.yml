name: Bootstrap source tree

on:
  push:
    branches: ["develop"]
    paths:
      - "source_bundle.tar.gz"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Expand source snapshot
        run: |
          set -euo pipefail
          tar -xzf source_bundle.tar.gz
          rm -f source_bundle.tar.gz .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: import SUPERBID Deal Intelligence v0.10"
          git push origin HEAD:develop
