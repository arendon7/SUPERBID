services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      SUPERBID_DB: /data/superbid.db
      SUPERBID_DISCOVERY_INTERVAL: "3600"
      SUPERBID_IDLE_SECONDS: "30"
      SUPERBID_CAPTURE_SECONDS: "12"
      SUPERBID_SYNC_INTERVAL: "300"
    env_file:
      - .env
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
