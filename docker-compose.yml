services:
  api:
    build: .
    environment:
      SUPERBID_DB: /data/superbid.db
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "superbid_collector.worker_v2"]
    environment:
      SUPERBID_DB: /data/superbid.db
      SUPERBID_WATCHLIST: /data/watchlist.txt
      SUPERBID_DISCOVERY_INTERVAL: "3600"
      SUPERBID_IDLE_SECONDS: "30"
      SUPERBID_CAPTURE_SECONDS: "12"
    volumes:
      - ./data:/data
    restart: unless-stopped
