services:
  - type: web
    name: superbid-deal-intelligence
    runtime: docker
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: superbid-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: SUPERBID_DB
        value: /data/superbid.db
      - key: SUPERBID_DISCOVERY_INTERVAL
        value: "3600"
      - key: SUPERBID_IDLE_SECONDS
        value: "30"
      - key: SUPERBID_CAPTURE_SECONDS
        value: "12"
      - key: SUPERBID_QUEUE_BATCH
        value: "20"
      - key: SUPERBID_DIRECT_HTTP_ENABLED
        value: "1"
      - key: SUPERBID_PUBLIC_PORTAL_ID
        value: "[17]"
      - key: SUPERBID_PUBLIC_LOCALE
        value: es_CO
      - key: SUPERBID_PUBLIC_TIMEZONE
        value: UTC
      - key: SUPERBID_PUBLIC_REQUEST_ORIGIN
        value: marketplace
      - key: SUPERBID_DIRECT_DISCOVERY_ENABLED
        value: "1"
      - key: SUPERBID_BROWSER_DISCOVERY_ALWAYS
        value: "0"
      - key: SUPERBID_DIRECT_DISCOVERY_PAGE_SIZE
        value: "24"
      - key: SUPERBID_DIRECT_DISCOVERY_MAX_PAGES
        value: "25"
      - key: SUPERBID_VEHICLE_CATEGORY_IDS
        value: "10000,10022"
      - key: SUPERBID_ADMIN_TOKEN
        generateValue: true
      - key: SUPERBID_DASHBOARD_TOKEN
        generateValue: true
      - key: MELI_ACCESS_TOKEN
        sync: false
      - key: SUPABASE_URL
        value: https://bxsfxydhuaqlkfoicbaz.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPERBID_SYNC_INTERVAL
        value: "300"
      - key: SUPERBID_DISCOVERY_URLS
        value: https://www.superbid.com.co/
      - key: SUPERBID_DISCOVERY_PAGINATED_URLS
        sync: false
      - key: SUPERBID_DISCOVERY_MAX_PAGES
        value: "10"
      - key: SUPERBID_DISCOVERY_PAGE_SIZE
        value: "30"
