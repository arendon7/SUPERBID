[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superbid-collector"
version = "0.57.1"
description = "Collector de inteligencia de subastas Superbid para análisis de vehículos."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-dateutil>=2.9",
  "supervisor>=4.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
browser = ["playwright==1.46.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
superbid = "superbid_collector.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
superbid_collector = ["templates/*.html", "static/*.css", "static/*.js"]
